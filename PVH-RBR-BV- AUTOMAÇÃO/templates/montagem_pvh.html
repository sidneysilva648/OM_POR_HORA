<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Detalhamento por Horário — PVH</title>
<style>
:root {
  --azul-bemol: #1e57c4;
  --azul-bemol-escuro: #0f3a8f;
  --verde: #2ecc71;
  --vermelho: #e74c3c;
  --azul-claro: #3498db;
  --laranja: #f39c12;
  --rosa-meta: #e91e63;
  --cinza-borda: #d5dbe3;
  --cinza-texto: #5a6878;
  --cinza-fundo: #f4f6f9;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: white; color: #1d2939; }

.dashboard {
  width: 1100px;
  background: white;
  padding: 28px 36px;
  border-radius: 18px;
  box-shadow: 0 4px 24px rgba(30,87,196,0.06);
}

/* ===== HEADER ===== */
.logo-area {
  background: #eaf3ff;
  padding: 24px 0 22px;
  border-radius: 14px;
  text-align: center;
  margin-bottom: 22px;
}
.logo-img {
  display: inline-block;
  max-height: 96px;          /* logo maior — conforme o modelo enviado */
  width: auto;
  vertical-align: middle;
}

.titulo {
  text-align: center;
  color: var(--azul-bemol);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 2.5px;
  margin-bottom: 6px;
}

.data {
  text-align: center;
  color: var(--cinza-texto);
  font-size: 14px;
  margin-bottom: 24px;
  font-weight: 500;
}
.data::before { content: '🗓️ '; }

/* ===== TABELA ===== */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--cinza-borda);
}
thead { background: var(--cinza-fundo); }
thead th {
  padding: 14px 8px;
  font-size: 11px;
  font-weight: 700;
  color: var(--azul-bemol);
  letter-spacing: 0.6px;
  border-bottom: 2px solid var(--cinza-borda);
  text-align: center;
  white-space: nowrap;
}
tbody td {
  padding: 11px 8px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: #1d2939;
  border-bottom: 1px solid #eef1f5;
}
tbody tr:last-child td { border-bottom: none; }

.hora {
  background: var(--cinza-fundo);
  color: var(--azul-bemol-escuro);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.5px;
}
.meta {
  background: #eef3fc;
  color: var(--azul-bemol);
  font-weight: 700;
}
.diferenca.neg { background: #fde9e7; color: var(--vermelho); font-weight: 700; }
.diferenca.pos { background: #e6f7ec; color: var(--verde); font-weight: 700; }
.diferenca.zero { background: #f4f6f9; color: var(--cinza-texto); font-weight: 700; }
.vazio { color: #c1c8d2; font-weight: 400; }

.dot {
  display: inline-block;
  width: 16px; height: 16px;
  border-radius: 50%;
  vertical-align: middle;
  margin-right: 5px;
  position: relative;
}
.dot.verde { background: var(--verde); }
.dot.vermelho { background: var(--vermelho); }
.dot.azul { background: var(--azul-claro); }
.dot.rosa { background: var(--rosa-meta); }
.dot.laranja { background: var(--laranja); }
.dot::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 10px;
  font-weight: 900;
}
.dot.verde::after { content: '✓'; }
.dot.vermelho::after { content: '✕'; }
.dot.azul::after { content: '▶'; font-size: 7px; }
.dot.rosa::after { content: '★'; font-size: 9px; }
.dot.laranja::after { content: '↗'; font-size: 10px; }
</style>
</head>
<body>

<div class="dashboard" id="dash-root">

  <div class="logo-area">
    <img class="logo-img" src="{{LOGO_BASE64}}" alt="Bemol">
  </div>

  <div class="titulo">DETALHAMENTO POR HORÁRIO</div>
  <div class="data" id="data">{{DATA}}</div>

  <table>
    <thead>
      <tr>
        <th>HORA</th>
        <th><span class="dot verde"></span>SUCESSO</th>
        <th><span class="dot vermelho"></span>INSUCESSO</th>
        <th><span class="dot azul"></span>INICIADAS</th>
        <th><span class="dot rosa"></span>META</th>
        <th><span class="dot laranja"></span>DIFERENÇA</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<script>
const DADOS = {{DADOS_JSON}};
const tbody = document.getElementById('tbody');

DADOS.parciais.forEach(p => {
  const tr = document.createElement('tr');
  const sucesso   = p.sucesso   ?? null;
  const insucesso = p.insucesso ?? null;
  const iniciadas = p.iniciadas ?? null;
  const meta      = p.meta;
  const diff      = sucesso === null ? null : (sucesso - meta);
  const fmt = v => v === null ? '<span class="vazio">-</span>' : v;
  const diffCls = diff === null ? '' : (diff < 0 ? 'neg' : (diff > 0 ? 'pos' : 'zero'));
  const diffStr = diff === null ? '<span class="vazio">-</span>' : (diff > 0 ? '+' + diff : diff);
  tr.innerHTML = `
    <td class="hora">${p.hora}</td>
    <td>${fmt(sucesso)}</td>
    <td>${fmt(insucesso)}</td>
    <td>${fmt(iniciadas)}</td>
    <td class="meta">${meta}</td>
    <td class="diferenca ${diffCls}">${diffStr}</td>
  `;
  tbody.appendChild(tr);
});
window.__dashReady = true;
</script>
</body>
</html>
